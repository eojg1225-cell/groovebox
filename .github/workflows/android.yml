name: Android APK

# Builds the Capacitor app (the web build in an Android shell) as a debug APK, signed with the
# committed debug key so each one installs over the last. Download it from the run's
# artifacts (groovebox-apk) and sideload it on the Fire.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Fetches (with retries) and caches the Gradle the wrapper names.
      - uses: gradle/actions/setup-gradle@v4
      # The native audio library (native/, Rust) for 64- and 32-bit ARM phones / Fire tablets
      # and x86_64 emulators, into the app's jniLibs (cargo-ndk finds the runner's NDK by
      # ANDROID_NDK_ROOT; native/rust-toolchain.toml pins Rust and its Android targets).
      # cargo-ndk and the engine's build kept between runs (a fresh install took minutes).
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/registry
            native/target
          key: native-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}
          restore-keys: native-${{ runner.os }}-
      # The library unwinds on a panic (the release profile aborts, as WebAssembly must), so
      # host.rs catches one and starts a fresh engine instead of the app crashing.
      - name: Native library
        run: |
          command -v cargo-ndk || cargo install cargo-ndk --locked
          cd native
          cargo test
          cargo clippy --all-targets -- -D warnings
          cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 -o ../android/app/src/main/jniLibs build --release --config 'profile.release.panic="unwind"'
          ls -la ../android/app/src/main/jniLibs/*
      - run: npm ci
      # The engine golden test: the native and WebAssembly builds play the same, and as golden.json says.
      - run: npm run engine:golden
      - run: npm run build
      - run: npx cap sync android
      - name: Build the debug APK
        working-directory: android
        # The Gradle download has failed with 504s: fetch it (a cheap task) with retries first.
        run: |
          for i in 1 2 3 4 5; do ./gradlew --version --no-daemon && break; echo "retry $i"; sleep $((i * 15)); done
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: groovebox-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
