name: Android APK

# Builds the Capacitor app (the web build in an Android shell) as a debug APK, signed with the
# committed debug key so each one installs over the last. Download it from the run's
# artifacts (groovebox-apk) and sideload it on the Fire.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Fetches (with retries) and caches the Gradle the wrapper names.
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: groovebox-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
